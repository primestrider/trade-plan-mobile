name: Distribute Android

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to raise (major only from here)"
        type: choice
        default: none
        options: [none, patch, minor, major]

concurrency:
  group: android-distribution
  cancel-in-progress: false

permissions:
  contents: write # push the version commit + tag
  pull-requests: read # find the PR holding this commit, to read its branch name

jobs:
  distribute:
    runs-on: ubuntu-latest
    environment: app-distribution
    timeout-minutes: 45

    # Second guard against a loop: the version commit already carries [skip ci],
    # but if that marker ever falls out of the message this workflow would
    # trigger itself forever. This guard makes that loop impossible.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the version commit step pushes back to main, and a
          # push from a shallow clone is rejected.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # setup-java's `cache: gradle` is unusable here: it looks for **/*.gradle*
      # at checkout time, while android/ is gitignored and only exists after
      # prebuild. The key is pinned to package-lock.json instead, because the
      # Expo version pinned there is what determines both the Gradle version and
      # the native dependencies.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # The branch prefix decides which part of the version goes up:
      #
      #   feat, feature                      → minor  (1.2.3 → 1.3.0)
      #   fix, patch, refactor, and the rest → patch  (1.2.3 → 1.2.4)
      #   major                              → only via "Run workflow"
      #
      # refactor lands in the patch bucket because it adds nothing a user can
      # see; the same goes for perf, chore, docs, test, ci and build. An unknown
      # prefix also falls through to patch rather than failing: every merge
      # produces a build, and every build needs a unique versionCode.
      #
      # The branch name is read from the PR containing this commit, not from the
      # merge commit message: squash and rebase merges leave no branch name in
      # the message at all. When a commit has no PR (a direct push to main), the
      # prefix comes from the conventional commit type in its subject.
      - name: Resolve version bump
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_BUMP: ${{ inputs.bump }}
        run: |
          SUBJECT="$(git log -1 --pretty=%s)"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            BUMP="$MANUAL_BUMP"
            SOURCE="manual choice"

            # A manual run from a working branch is how the pipeline gets tested
            # before a merge. Version commits may only be born on main, so the
            # bump is switched off here rather than producing an APK carrying a
            # version number that is never recorded anywhere.
            if [ "$BUMP" != "none" ] && [ "$GITHUB_REF_NAME" != "main" ]; then
              echo "::warning::Versions are only bumped from main; the run on $GITHUB_REF_NAME keeps the current version."
              BUMP=none
              SOURCE="skipped (not main)"
            fi
          else
            BRANCH="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              --jq '.[0].head.ref // empty' 2>/dev/null || true)"

            if [ -n "$BRANCH" ]; then
              PREFIX="${BRANCH%%/*}"
              SOURCE="branch $BRANCH"
            else
              # "feat(ci): message" → "feat"; "docs: message" → "docs";
              # a subject without ":" matches nothing and falls through.
              PREFIX="${SUBJECT%%[(:]*}"
              SOURCE="commit subject"
            fi

            PREFIX="$(printf '%s' "$PREFIX" | tr '[:upper:]' '[:lower:]')"

            case "$PREFIX" in
              feat | feature)
                BUMP=minor
                ;;
              fix | bugfix | hotfix | patch | refactor | perf | chore | docs | test | style | ci | build | revert)
                BUMP=patch
                ;;
              *)
                BUMP=patch
                echo "::notice::Unknown prefix \"$PREFIX\", treated as patch."
                ;;
            esac
          fi

          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "subject=$SUBJECT" >> "$GITHUB_OUTPUT"
          echo "Bump: $BUMP (from $SOURCE)"

      - name: Install dependencies
        run: npm ci

      # An Android build takes well over ten minutes, so the suite runs first:
      # distributing a build whose tests are red is far more expensive.
      - name: Run tests
        run: npm test

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          # Absolute path: file() in build.gradle resolves relative paths
          # against android/app, not the repo root.
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      # Validated here, ahead of the ten-plus-minute build, because credentials
      # that are empty or malformed only surface in the last step as "Failed to
      # authenticate, have you run firebase login?" — a message that never
      # mentions the credentials file and points the wrong way.
      - name: Write Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          CREDS="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$CREDS"

          if [ ! -s "$CREDS" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT_JSON is empty or missing. Check its exact name in the app-distribution environment."
            exit 1
          fi

          node -e '
            const fs = require("fs");
            let creds;
            try {
              creds = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            } catch (error) {
              console.log(`::error::FIREBASE_SERVICE_ACCOUNT_JSON is not valid JSON: ${error.message}`);
              process.exit(1);
            }
            if (creds.type !== "service_account") {
              console.log(`::error::The type field is ${JSON.stringify(creds.type)}, expected "service_account" — what was downloaded is probably not a service account key.`);
              process.exit(1);
            }
            for (const field of ["private_key", "client_email", "project_id"]) {
              if (!creds[field]) {
                console.log(`::error::Field ${field} is missing from the service account key.`);
                process.exit(1);
              }
            }
            console.log(`Service account key is valid for project ${creds.project_id}.`);
          ' "$CREDS"

          echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDS" >> "$GITHUB_ENV"

      # Placed after the tests and the credential check so that cheap failures
      # do not burn a version number, but before the build: package.json is the
      # source of `version` in app.config.ts and of `versionCode` in
      # configs/android.config.ts, so prebuild has to see the raised number.
      - name: Bump version
        id: version
        env:
          BUMP: ${{ steps.plan.outputs.bump }}
        run: |
          if [ "$BUMP" != "none" ]; then
            npm version "$BUMP" --no-git-tag-version > /dev/null
          fi

          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      # The commit is pushed before the build, not after. A failed build then
      # leaves a version number spent without a release — which is cheap. The
      # other order costs far more: the next run would pick up the same number
      # and ship two different APKs with an identical versionCode to testers.
      #
      # [skip ci] keeps this commit from triggering the workflow itself.
      - name: Commit version bump
        if: steps.plan.outputs.bump != 'none'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v$VERSION [skip ci]"

          # The push is rejected if anyone pushed to main while the run was in
          # flight. Deliberately not rebased automatically: a rebase would pull
          # changes that never went through `npm test` in this run into the APK
          # being built.
          git push origin "HEAD:$GITHUB_REF_NAME"

      # android/ is gitignored, so the native project is rebuilt on every run.
      # --no-install because npm ci above already installed the dependencies.
      - name: Prebuild Android project
        env:
          EXPO_PUBLIC_APP_NAME: ${{ vars.EXPO_PUBLIC_APP_NAME }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        env:
          NODE_ENV: production
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPO_PUBLIC_APP_NAME: ${{ vars.EXPO_PUBLIC_APP_NAME }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: |
          # The executable bit on the gradlew extracted from the template is not
          # guaranteed; without this the step fails with a misleading
          # "Permission denied".
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      # The signing config is chosen at Gradle runtime, so only a runtime check
      # can prove the release keystore was actually used. Without this step a
      # debug-signed APK could reach testers with no symptom at all.
      - name: Verify APK is signed with the release key
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -r | head -1)"
          "$APKSIGNER" verify --print-certs \
            android/app/build/outputs/apk/release/app-release.apk \
            | tee "$RUNNER_TEMP/certs.txt"
          if grep -qi "CN=Android Debug" "$RUNNER_TEMP/certs.txt"; then
            echo "::error::The APK is signed with the debug key, not the release key."
            exit 1
          fi

      # Uploaded before the Firebase step so the APK can still be fetched by
      # hand if the upload to App Distribution fails.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk-v${{ steps.version.outputs.version }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Distribute to Firebase App Distribution
        env:
          FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS }}
          VERSION: ${{ steps.version.outputs.version }}
          SUBJECT: ${{ steps.plan.outputs.subject }}
        run: |
          RELEASE_NOTES="v$VERSION — $SUBJECT (#${{ github.run_number }} ${GITHUB_SHA::7})"
          npx --yes firebase-tools@15 appdistribution:distribute \
            android/app/build/outputs/apk/release/app-release.apk \
            --app "$FIREBASE_ANDROID_APP_ID" \
            --groups "$FIREBASE_TESTER_GROUPS" \
            --release-notes "$RELEASE_NOTES"

      # The tag is created last, after a successful distribution, so that `v*`
      # only marks versions that actually reached testers. The version commit
      # itself was already pushed, so a failure here never causes a version
      # number to be reused.
      - name: Tag released version
        if: steps.plan.outputs.bump != 'none'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
